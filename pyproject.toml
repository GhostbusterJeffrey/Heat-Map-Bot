[project]
name = "tpr-terminal"
version = "4.2.0a1.dev1"
description = "The Printing Room V4 quantitative options-risk terminal"
requires-python = ">=3.12,<3.15"
dependencies = [
  "discord.py>=2.7,<3.0",
  "yfinance>=0.2.66,<2.0",
  "pandas>=2.3,<3.0",
  "numpy>=2.3,<3.0",
  "scipy>=1.17,<2.0",
  "matplotlib>=3.10,<4.0",
  "python-dotenv>=1.1,<2.0",
  "pillow>=11,<13",
  "tzdata>=2025.1",
]

[project.scripts]
tpr-terminal = "tpr_terminal.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["tpr_terminal*"]
exclude = ["assets*", "logs*", "tests*"]
